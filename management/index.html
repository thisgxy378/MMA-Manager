<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Manager</title><style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#151d29;--panel2:#1b2635;--line:#2b3a4b;--txt:#eaf1fa;--muted:#9caec3;--accent:#eab65c;--good:#66c8a3;--bad:#e77d7d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,Segoe UI,sans-serif}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;padding:9px 12px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#1a1711;font-weight:750;border:0}button:disabled{opacity:.4;cursor:not-allowed}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.sidebar{background:#101723;border-right:1px solid var(--line);padding:22px 12px}.brand{font-size:22px;font-weight:900;letter-spacing:.08em;margin:0 10px 24px}.brand span{color:var(--accent)}.nav{display:block;width:100%;text-align:left;margin:3px 0;border:0;background:transparent;color:var(--muted);padding:12px}.nav.active{background:var(--panel2);color:var(--accent);font-weight:700}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}.sub{color:var(--muted)}h1{font-size:27px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{margin:0 0 7px}.cards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.stat{font-size:25px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.stack{display:grid;gap:16px}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--muted);font-size:12px}.good{color:var(--good)}.bad{color:var(--bad)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-weight:600;font-size:12px}td,th{padding:11px 8px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.small{font-size:12px}.muted{color:var(--muted)}select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px}.feed{padding:12px 0;border-bottom:1px solid var(--line)}.feed:last-child{border:0}.setup{max-width:850px;margin:8vh auto;padding:24px}.promos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.promo{text-align:left;padding:22px}.promo strong{font-size:24px;display:block}.notice{background:#26303b;border-left:3px solid var(--accent);padding:12px;margin:14px 0;border-radius:4px}.bar{height:6px;background:#263244;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{color:var(--muted);padding:25px;text-align:center}.tag{color:var(--accent)}@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{display:flex;flex-wrap:wrap;gap:4px;padding:10px}.brand{width:100%;margin:0}.nav{width:auto}.main{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:540px){.promos{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.panel{overflow-x:auto}}
 .event-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.event-fields label{display:grid;gap:5px;color:var(--muted)}.event-fields input,.stack input{width:100%;min-width:0;padding:9px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px}@media(max-width:600px){.event-fields{grid-template-columns:1fr}}.negotiation-overlay{position:fixed;inset:0;background:#05080dc9;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.negotiation-dialog{width:min(740px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 18px 70px #0008}.negotiation-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.negotiation-fields label{display:grid;gap:5px;color:var(--muted)}.negotiation-fields input,.negotiation-fields select{width:100%;padding:10px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px}.negotiation-summary{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:10px}.negotiation-summary .feed{display:flex;justify-content:space-between;gap:12px}.negotiation-result{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px}@media(max-width:560px){.negotiation-fields{grid-template-columns:1fr}} </style></head><body><div id="root"></div><script>
const PROMOS={UFC:{budget:18000000,prestige:96,desc:'Global leader · high expectations'},PFL:{budget:8000000,prestige:75,desc:'International challenger · build momentum'},ONE:{budget:10500000,prestige:82,desc:'Asian powerhouse · develop regional stars'},RIZIN:{budget:6500000,prestige:77,desc:'Japanese powerhouse · distinctive events'}};
const REGION=['Eternal MMA','Streetbeefs','Cage Warriors','LFA','OKTAGON MMA','KSW','BRAVE CF'];
const names=['Noah Mercer','Kai Bennett','Rafael Costa','Tane Ropata','Marcus Vale','Eli Navarro','Luca Moretti','Jin Park','Oliver Price','Darius Cole','Mateo Silva','Finn O’Connor','Hiro Tanaka','Samir Haddad','Tobias Grant','Leo Andrade','Mason Brooks','Aiden Quinn','Arman Sato','Isaac Okafor','Kieran Moss','Andre Velez','Felix Ward','Niko Petrov','Jasper King','Tariq Rahman','Benji Clarke','Yuto Mori'];
const NATIONALITIES=["New Zealand","Australia","Brazil","New Zealand","United States","Mexico","Italy","South Korea","United Kingdom","United States","Brazil","Ireland","Japan","Lebanon","Germany","Brazil","United States","Ireland","Japan","Nigeria","United Kingdom","Colombia","United Kingdom","Bulgaria","Australia","Pakistan","New Zealand","Japan"];
const divisions=['Flyweight','Bantamweight','Featherweight','Lightweight','Welterweight','Middleweight','Light Heavyweight','Heavyweight'];
const $=id=>document.getElementById(id);const money=n=>'$'+Math.round(n).toLocaleString('en-US');const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function makeFighter(i){let region=REGION[i%REGION.length],skill=rand(48,76),potential=Math.min(96,skill+rand(4,22));return{id:i+1,name:names[i],nationality:NATIONALITIES[i],promotion:region,division:divisions[i%8],age:rand(20,32),wins:region==='Streetbeefs'?0:rand(1,13),losses:region==='Streetbeefs'?0:rand(0,5),amateurWins:region==='Streetbeefs'?rand(1,13):0,amateurLosses:region==='Streetbeefs'?rand(0,5):0,status:region==='Streetbeefs'?'Amateur':'Professional',skill,potential,popularity:rand(20,65),scouted:0,salary:rand(25000,125000),contract:rand(6,24),form:0}}
function initial(p){return{player:p,date:'2026-01-05',week:1,year:2026,cash:PROMOS[p].budget,prestige:PROMOS[p].prestige,fighters:names.map((_,i)=>makeFighter(i)),news:[`Welcome to ${p}. Your management career begins.`,`Regional scouting network activated across seven promotions.`],events:[],contracts:[],scoutTokens:8,offers:[],history:[],aiResults:[],selectedRegion:'All',selectedDivision:'All',selectedStatus:'All'}}
let state=null,tab='Overview';try{state=JSON.parse(localStorage.getItem('mma_gm_management_v01'))}catch(e){}
function migrate(){if(!state)return;if(!state.date){const w=Math.max(1,Number(state.week)||1),y=Number(state.year)||2026;state.date=new Date(Date.UTC(y,0,5+(w-1)*7)).toISOString().slice(0,10)}state.contracts=state.contracts||[];state.selectedNationality=state.selectedNationality||'All';state.scoutTokens=Math.max(8,Number(state.scoutTokens)||0);state.selectedStatus=state.selectedStatus||'All';state.offers=state.offers||[];state.fighters.forEach(f=>{if(!f.nationality)f.nationality=NATIONALITIES[f.id-1]||'Unknown';if(!f.status){f.status=f.promotion==='Streetbeefs'?'Amateur':'Professional';if(f.status==='Amateur'){f.amateurWins=f.wins||0;f.amateurLosses=f.losses||0;f.wins=0;f.losses=0}}if(!Number.isFinite(f.amateurWins))f.amateurWins=0;if(!Number.isFinite(f.amateurLosses))f.amateurLosses=0;if(f.promotion==='Streetbeefs'&&f.status!=='Amateur'){f.amateurWins+=f.wins||0;f.amateurLosses+=f.losses||0;f.wins=0;f.losses=0;f.status='Amateur'}if(f.promotion===state.player&&!state.contracts.some(c=>c.id===f.id)){state.contracts.push({id:f.id,show:Math.max(8000,Math.round(f.salary/4/1000)*1000),win:Math.max(8000,Math.round(f.salary/4/1000)*1000),signing:0,fights:4,weeks:104,start:now(),origin:"Existing roster"})}})}migrate();
function save(){try{localStorage.setItem('mma_gm_management_v01',JSON.stringify(state))}catch(e){}}
function log(t){state.news.unshift(t);state.news=state.news.slice(0,35)}
function setup(){return `<div class="setup"><h1>MMA <span class="tag">Manager</span></h1><p class="sub">Management alpha · Choose your promotion. The other major organisations operate as AI rivals, while regional promotions develop new talent.</p><div class="promos">${Object.entries(PROMOS).map(([k,v])=>`<button class="promo" data-start="${k}"><strong>${k}</strong><div class="muted">${v.desc}</div><p>Starting funds: ${money(v.budget)}</p><span class="pill">Prestige ${v.prestige}</span></button>`).join('')}</div><div class="notice">Prototype uses fictional fighters and illustrative budgets. Real promotion branding is for simulation context only; this is not affiliated with these organisations.</div></div>`}
const nav=['Overview','My Roster','Scouting Network','Fighter Market','Contracts','Events','World MMA','Finances'];
function render(){if(!state){$('root').innerHTML=setup();document.querySelectorAll('[data-start]').forEach(x=>x.onclick=()=>{state=initial(x.dataset.start);save();render()});return}
$('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">MMA <span>Manager</span></div><div class="sub" style="margin:0 10px 18px">${state.player} · Management Alpha</div>${nav.map(n=>`<button class="nav ${tab===n?'active':''}" data-tab="${n}">${n}</button>`).join('')}<div class="notice small">Fictional demo fighters. Regional events and AI recruitment simulate each week.</div></aside><main class="main"><div class="top"><div><h1>${tab}</h1><div class="sub">${dateLabel(state.date)} · ${state.player}</div></div><div class="actions"><button id="save">Save game</button><button id="exportCareer">Export career</button><button id="importCareer">Import career</button><input id="careerFile" type="file" accept=".json,application/json" hidden><button id="advanceDay">Advance 1 day →</button><button class="primary" id="advance">Advance 1 week →</button></div></div>${state.events.some(e=>!e.done&&eventDate(e)<=state.date)?'<div class="notice"><strong>Event day!</strong> Time advancement is paused until the scheduled event is simulated. Open Events to continue.</div>':''}<div id="content">${view()}</div></main></div>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('advance').onclick=()=>advance(7);$('advanceDay').onclick=()=>advance(1);$('save').onclick=()=>{save();alert('Saved locally in this browser.')};$('exportCareer').onclick=()=>{if(!state)return;const blob=new Blob([JSON.stringify({format:'MMA-Manager-Career',version:1,career:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='MMA-Manager-'+state.player+'-'+state.date+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};$('importCareer').onclick=()=>$('careerFile').click();$('careerFile').onchange=async(e)=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text());if(raw.format!=='MMA-Manager-Career'||raw.version!==1)throw Error('Unrecognised save format');const candidate=raw.career;if(!candidate||!PROMOS[candidate.player]||!Array.isArray(candidate.fighters)||!Array.isArray(candidate.events)||!Array.isArray(candidate.news)||!Array.isArray(candidate.contracts)||!Number.isFinite(candidate.cash))throw Error('Incomplete career data');if(!confirm('Replace the current locally saved career with '+candidate.player+'?'))return;state=candidate;migrate();save();render();alert('Career imported successfully.')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};bind()}
function stats(){return `<div class="cards"><div class="card"><div class="muted">Promotion funds</div><div class="stat">${money(state.cash)}</div></div><div class="card"><div class="muted">Signed fighters</div><div class="stat">${state.fighters.filter(f=>f.promotion===state.player).length}</div></div><div class="card"><div class="muted">Prestige</div><div class="stat">${state.prestige}/100</div></div><div class="card"><div class="muted">Scout reports available</div><div class="stat">${state.scoutTokens}</div></div></div>`}
function view(){switch(tab){case'Overview':return overview();case'My Roster':return roster();case'Scouting Network':return scouting();case'Fighter Market':return market();case'Contracts':return contracts();case'Events':return events();case'World MMA':return world();case'Finances':return finance()}}
function overview(){let next=state.events.filter(e=>!e.done&&eventDate(e)>=state.date).sort((a,b)=>eventDate(a).localeCompare(eventDate(b)))[0];return stats()+`<div class="grid"><div class="stack"><section class="panel"><h2>Management priorities</h2><div class="feed">Scout promising fighters from regional promotions to build your roster.</div><div class="feed">Sign prospects before rival promotions recruit them.</div><div class="feed">Build a full fight card and manage event budgets, hype, and awards.</div></section><section class="panel"><h2>Upcoming event</h2>${next?`<strong>${next.name}</strong><div class="muted">${shortDate(eventDate(next))} · ${(next.bouts||[]).length} bouts</div>`:'<div class="empty">No event booked yet. Sign at least two fighters and visit Events.</div>'}</section></div><section class="panel"><h2>Latest MMA news</h2>${state.news.slice(0,9).map(n=>`<div class="feed">${esc(n)}</div>`).join('')}</section></div>`}
function roster(){let arr=state.fighters.filter(f=>f.promotion===state.player);return stats()+`<section class="panel"><h2>${state.player} fighter roster</h2>${arr.length?fighterTable(arr,false):'<div class="empty">No signed fighters yet. Discover and recruit prospects through Scouting Network.</div>'}</section>`}
function fighterTable(arr,actions=true){return `<table><thead><tr><th>Fighter</th><th>Nationality</th><th>Division</th><th>Level</th><th>Record</th><th>Age</th><th>Est. ability</th><th>Potential</th><th>Promotion</th>${actions?'<th>Actions</th>':''}</tr></thead><tbody>${arr.map(f=>`<tr><td><strong>${esc(f.name)}</strong></td><td>${esc(f.nationality||'Unknown')}</td><td>${f.division}</td><td><span class="pill">${f.status}</span></td><td>${f.status==='Amateur'?`${f.amateurWins}-${f.amateurLosses} (AM)`:`${f.wins}-${f.losses} (PRO)`}</td><td>${f.age}</td><td>${f.scouted?`${f.skill-4}–${f.skill+4}`:'Unknown'}</td><td>${f.scouted>1?`${f.potential-5}–${f.potential+3}`:'?'}</td><td>${esc(f.promotion)}</td>${actions?`<td class="actions">${f.promotion!==state.player?`<button data-scout="${f.id}" ${state.scoutTokens<1||f.scouted>=2?'disabled':''}>${f.scouted>=2?'Complete':f.scouted?'Deep scout':'Scout'}</button><button data-sign="${f.id}" ${!f.scouted&&!REGION.includes(f.promotion)?'disabled':''}>Negotiate</button>`:'<span class="good">Signed</span>'}</td>`:''}</tr>`).join('')}</tbody></table>`}
function scouting(){let filtered=state.fighters.filter(f=>REGION.includes(f.promotion)).filter(f=>state.selectedRegion==='All'||f.promotion===state.selectedRegion).filter(f=>state.selectedDivision==='All'||f.division===state.selectedDivision).filter(f=>state.selectedStatus==='All'||f.status===state.selectedStatus).filter(f=>state.selectedNationality==='All'||f.nationality===state.selectedNationality);return `<div class="grid"><section class="panel"><h2>Regional scouting network</h2><p class="sub">Scouts reveal estimated ability. Reports cost one scouting credit. Gain eight credits every four weeks; you can negotiate with regional fighters without scouting first.</p><div class="row"><label>Promotion <select id="region">${['All',...REGION].map(r=>`<option ${state.selectedRegion===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Division <select id="division">${['All',...divisions].map(d=>`<option ${state.selectedDivision===d?'selected':''}>${d}</option>`).join('')}</select></label><label>Level <select id="fighterStatus">${['All','Amateur','Professional'].map(v=>`<option ${state.selectedStatus===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Nationality <select id="nationality">${['All',...new Set(state.fighters.map(f=>f.nationality||'Unknown'))].map(v=>`<option ${state.selectedNationality===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label></div><div class="notice">All Streetbeefs fighters are amateurs, with separate amateur records. Signing an amateur to your professional promotion converts them to a professional with a 0–0 pro record; their amateur record is retained.</div></section><section class="panel"><h2>Scouting resources</h2><div class="stat">${state.scoutTokens} reports</div><p class="muted">Regional organisations run independent events. Fighters gain experience and attract rival attention over time.</p></section></div><section class="panel" style="margin-top:16px"><h2>Available prospects (${filtered.length})</h2>${fighterTable(filtered)}</section>`}
function market(){let arr=state.fighters.filter(f=>f.promotion!==state.player&&(f.scouted||REGION.includes(f.promotion)));return `<section class="panel"><h2>Scouted fighter market</h2><p class="sub">Regional fighters can be approached without a scouting report. Scout first for better estimates. Contracts pay a show purse and (optionally) a win bonus for each bout. Rival promotion fighters cannot be signed while under exclusive contracts in this simplified model.</p>${arr.length?fighterTable(arr):'<div class="empty">Scout regional fighters first to unlock negotiations.</div>'}</section>`}
function contracts(){let signed=state.contracts.filter(c=>state.fighters.some(f=>f.id===c.id&&f.promotion===state.player));return `<div class="grid"><section class="panel"><h2>Active fighter contracts</h2>${signed.length?`<table><thead><tr><th>Fighter</th><th>Show / Win</th><th>Fights left</th><th>Weeks left</th></tr></thead><tbody>${signed.map(c=>{let f=state.fighters.find(f=>f.id===c.id);return `<tr><td>${esc(f.name)}</td><td>${money(c.show)} / ${money(c.win)}</td><td>${c.fights}</td><td>${Math.max(0,c.weeks-(now()-c.start))}</td></tr>`}).join('')}</tbody></table>`:'<p class="muted">No active contracts.</p>'}</section><section class="panel"><h2>Contract principles</h2><p>Fighters receive show money for competing, plus a win bonus if they win. Agreements expire after their contracted bouts or time limit. Sign-on payments are charged immediately.</p><p class="muted">This is a gameplay approximation, not legal advice or a reproduction of any promotion’s confidential agreements.</p></section></div><section class="panel" style="margin-top:16px"><h2>Negotiation history</h2>${(state.offers||[]).slice().reverse().slice(0,15).map(o=>`<div class="feed">${esc(o)}</div>`).join('')||'<p class="muted">No offers yet.</p>'}</section>`}
function currentDate(){return new Date(state.date+'T12:00:00Z')}function iso(d){return d.toISOString().slice(0,10)}function dateLabel(v){return new Date(v+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})}function shortDate(v){return new Date(v+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})}function addDays(v,n){let d=new Date(v+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)}function daysSinceStart(){return Math.round((currentDate()-new Date('2026-01-05T12:00:00Z'))/86400000)}function now(){return Math.floor(daysSinceStart()/7)+1}function eventDate(e){return e.date||addDays('2026-01-05',((Number(e.year)||2026)-2026)*364+((Number(e.week)||1)-1)*7)}
function negotiate(id){let f=state.fighters.find(f=>f.id===id);if(!f||(!f.scouted&&!REGION.includes(f.promotion))||f.promotion===state.player)return;let expected=Math.round((6500+f.skill*f.skill*5+f.popularity*170)/1000)*1000;let current=f.promotion;let defaultShow=expected;let show=Number(prompt(`Offer for ${f.name} (${current}).\nShow purse per fight in USD (expected approx. ${money(expected)}):`,defaultShow));if(!Number.isFinite(show)||show<1000)return;let win=Number(prompt('Win bonus per victory in USD:',show));if(!Number.isFinite(win)||win<0)return;let fights=Number(prompt('Number of contracted fights (1–8):','4'));if(!Number.isInteger(fights)||fights<1||fights>8)return;let months=Number(prompt('Maximum contract term in months (6–48):','24'));if(!Number.isInteger(months)||months<6||months>48)return;let bonus=Number(prompt('Upfront signing bonus in USD:','0'));if(!Number.isFinite(bonus)||bonus<0)return;let demand=expected*(f.promotion==='Streetbeefs'?.82:1);let offerValue=show+win*.42+bonus/Math.max(1,fights);let demandValue=demand*1.38;let ratio=offerValue/demandValue;let reputation=(state.prestige-65)/150;let odds=Math.max(.04,Math.min(.96,.45+(ratio-1)*1.15+reputation+(months>=18?.06:0)));if(state.cash<bonus+show)return alert('Insufficient funds to cover the signing bonus and first show purse.');let accepted=Math.random()<odds;let detail=`${f.name}: ${money(show)} show / ${money(win)} win, ${fights} fights, ${months} months, ${money(bonus)} bonus — ${accepted?'ACCEPTED':'DECLINED'}`;state.offers.push(detail);if(accepted){state.cash-=bonus;if(f.status==='Amateur'){f.status='Professional';log(`${f.name} turns professional after an amateur record of ${f.amateurWins}-${f.amateurLosses}.`)}f.promotion=state.player;state.contracts=state.contracts.filter(c=>c.id!==f.id);state.contracts.push({id:f.id,show,win,signing:bonus,fights,weeks:Math.round(months*52/12),start:now(),origin:current});log(`${state.player} signs ${f.name} from ${current}: ${fights}-fight agreement.`)}else{log(`${f.name} rejects ${state.player}'s contract offer.`)}save();render();alert(accepted?'Offer accepted!':'Offer declined. Improve the guaranteed purse, win bonus or signing bonus and try again.')}
function events(){let roster=state.fighters.filter(f=>f.promotion===state.player);return `<div class="grid"><section class="panel"><h2>Book a main event</h2><p class="sub">Prototype supports one main event per card. Fighters must share a weight division.</p><div class="stack"><label>Fighter A <select id="fightA"><option value="">Choose fighter</option>${roster.map(f=>`<option value="${f.id}">${esc(f.name)} · ${f.division}</option>`).join('')}</select></label><label>Fighter B <select id="fightB"><option value="">Choose fighter</option>${roster.map(f=>`<option value="${f.id}">${esc(f.name)} · ${f.division}</option>`).join('')}</select></label><label>Event name <input id="eventName" value="${state.player} Fight Night" style="padding:9px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:white"></label><button class="primary" id="book">Book for ${shortDate(addDays(state.date,14))}</button></div></section><section class="panel"><h2>Scheduled & completed cards</h2>${state.events.length?state.events.slice().reverse().map(e=>`<div class="feed"><strong>${esc(e.name)}</strong><div class="muted">${shortDate(eventDate(e))} · ${esc(e.a)} vs ${esc(e.b)}</div><div>${e.done?`<span class="good">${esc(e.result)}</span>`:eventDate(e)<=state.date?'<span class="tag">Event day — awaiting simulation</span>':'Upcoming'}</div>${!e.done&&eventDate(e)<=state.date?'<button class="primary" id="runEvent">Simulate event</button>':''}</div>`).join(''):'<div class="empty">No events yet</div>'}</section></div>`}
function world(){return `<div class="grid"><section class="panel"><h2>Major promotions</h2>${Object.entries(PROMOS).map(([k,v])=>`<div class="feed row"><div><strong>${k}</strong><div class="muted">${v.desc}</div></div><span class="pill">${k===state.player?'Player':'AI controlled'}</span></div>`).join('')}</section><section class="panel"><h2>Regional development circuit</h2>${REGION.map(r=>`<div class="feed row"><strong>${r}</strong><span class="pill">${state.fighters.filter(f=>f.promotion===r).length} fighters</span></div>`).join('')}</section></div><section class="panel" style="margin-top:16px"><h2>World results</h2>${state.aiResults.length?state.aiResults.slice(0,14).map(r=>`<div class="feed">${esc(r)}</div>`).join(''):'<div class="empty">Advance time to generate regional results.</div>'}</section>`}
function finance(){let signed=state.fighters.filter(f=>f.promotion===state.player);let payroll=state.contracts.filter(c=>signed.some(f=>f.id===c.id)).reduce((a,c)=>a+c.show+c.win,0);return stats()+`<div class="grid"><section class="panel"><h2>Financial overview</h2><div class="feed row"><span>Available funds</span><strong>${money(state.cash)}</strong></div><div class="feed row"><span>Estimated purses if all signed fighters win</span><strong>${money(payroll)}</strong></div><div class="feed row"><span>Weekly operating overhead</span><strong>${money(15000+signed.length*1500)}</strong></div><div class="feed row"><span>Event revenue</span><span class="muted">Generated on fight week</span></div></section><section class="panel"><h2>Business model</h2><p>Promotions earn revenue from hosted events and pay show purses, win bonuses and overhead. The prototype uses illustrative financial values rather than real company figures.</p></section></div>`}
function bind(){document.querySelectorAll('[data-scout]').forEach(b=>b.onclick=()=>{let f=state.fighters.find(x=>x.id==b.dataset.scout);if(!f||state.scoutTokens<1||f.scouted>=2)return;f.scouted++;state.scoutTokens--;log(`Scout report completed: ${f.name} (${f.promotion}), ${f.division}.`);save();render()});document.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>negotiate(Number(b.dataset.sign)));if($('region'))$('region').onchange=e=>{state.selectedRegion=e.target.value;save();render()};if($('division'))$('division').onchange=e=>{state.selectedDivision=e.target.value;save();render()};if($('fighterStatus'))$('fighterStatus').onchange=e=>{state.selectedStatus=e.target.value;save();render()};if($('nationality'))$('nationality').onchange=e=>{state.selectedNationality=e.target.value;save();render()};if(false&&$('book'))$('book').onclick=()=>{let a=state.fighters.find(f=>f.id==$('fightA').value),b=state.fighters.find(f=>f.id==$('fightB').value);if(!a||!b||a.id===b.id)return alert('Select two different fighters.');if(a.status!=='Professional'||b.status!=='Professional')return alert('Professional events require professional fighters.');if(a.division!==b.division)return alert('Fighters must share a weight division.');if(state.events.some(e=>!e.done&&[e.a,e.b].some(n=>n===a.name||n===b.name)))return alert('One fighter is already booked.');let name=$('eventName').value.trim().slice(0,60)||`${state.player} Fight Night`;state.events.push({name,a:a.name,b:b.name,aid:a.id,bid:b.id,week:state.week+2,date:addDays(state.date,14),done:false});log(`Booked ${name}: ${a.name} vs ${b.name}.`);save();render()}}
function advance(days=1){if(state.events.some(e=>!e.done&&eventDate(e)<=state.date)){tab='Events';render();return}for(let day=0;day<days;day++){state.date=addDays(state.date,1);let d=currentDate();state.year=d.getUTCFullYear();state.week=now();const monday=d.getUTCDay()===1;if(monday){let roster=state.fighters.filter(f=>f.promotion===state.player);state.cash-=15000+roster.length*1500;if(state.week%4===0){state.scoutTokens+=8;log('Scouting team replenished eight detailed reports.')}}
if(d.getUTCDay()===1)weeklyWorldTick(true);if(state.events.some(e=>!e.done&&eventDate(e)===state.date)){tab='Events';break}}save();render()}
function weeklyWorldTick(monday){if(monday&&state.week%2===0){let groups=REGION.filter(r=>state.fighters.filter(f=>f.promotion===r).length>=2);if(groups.length){let region=groups[rand(0,groups.length-1)],pool=state.fighters.filter(f=>f.promotion===region);let a=pool[rand(0,pool.length-1)],b=pool.filter(f=>f.id!==a.id&&f.status===a.status).sort((x,y)=>Math.abs(x.division===a.division?0:1)-Math.abs(y.division===a.division?0:1))[0];if(b){let w=Math.random()<.5?a:b,l=w===a?b:a;if(region==='Streetbeefs'){w.amateurWins++;l.amateurLosses++}else{w.wins++;l.losses++}w.skill=Math.min(95,w.skill+(Math.random()<.3?1:0));let result=`${region}: ${w.name} def. ${l.name} (${region==='Streetbeefs'?`${w.amateurWins}-${w.amateurLosses} AM`:`${w.wins}-${w.losses} PRO`})`;state.aiResults.unshift(result);log(result)}}}
if(monday&&state.week%6===0){let pool=state.fighters.filter(f=>REGION.includes(f.promotion));if(pool.length){let f=pool[rand(0,pool.length-1)],rivals=Object.keys(PROMOS).filter(p=>p!==state.player);let destination=rivals[rand(0,rivals.length-1)],old=f.promotion;if(f.status==='Amateur'){f.status='Professional';log(`${f.name} turns professional after ${f.amateurWins}-${f.amateurLosses} amateur bouts.`)}f.promotion=destination;log(`${destination} signs ${f.name} from ${old}.`)}}
for(const c of [...state.contracts]){if(c.fights<=0||now()-c.start>=c.weeks){let f=state.fighters.find(x=>x.id===c.id);if(f&&f.promotion===state.player){f.promotion='Free Agent';log(`${f.name}'s contract expires. Fighter enters free agency.`)}state.contracts=state.contracts.filter(x=>x!==c)}}}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script><script src="events.js"></script><script src="negotiations.js"></script></body></html>
