function parseRosterCSV(source){

 else if(c===','&&!quoted){row.push(cell);cell=''}
 else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&source[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}
 else cell+=c}
 if(quoted)throw Error('CSV contains an unclosed quote.');
 row.push(cell);if(row.some(v=>v.trim()))rows.push(row);
 const headers=(rows.shift()||[]).map(h=>h.trim().replace(/^\uFEFF/,''));
 return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,(values[i]||'').trim()])));
}

 const names=new Set(),errors=[],fighters=[];
 const numberFields=['age','skill','potential','wins','losses','draws','popularity','height','reach'];
 list.forEach((row,i)=>{
  if(!row||typeof row!=='object'||Array.isArray(row)){errors.push('Row '+(i+1)+': invalid fighter');return}
  const f={...row},name=String(f.name||'').trim(),promotion=String(f.promotion||'').trim(),division=String(f.division||'').trim(),gender=String(f.gender||'').trim();
  if(!name||!promotion||!division||!['Male','Female'].includes(gender)){errors.push('Row '+(i+1)+': name, promotion, division and gender (Male/Female) are required');return}
  const key=[name.toLowerCase(),gender.toLowerCase()].join('|');
  if(names.has(key)){errors.push('Row '+(i+1)+': duplicate '+name);return}names.add(key);
  for(const field of numberFields)if(f[field]!==undefined&&f[field]!==''){const n=Number(f[field]);if(!Number.isFinite(n)||n<0){errors.push('Row '+(i+1)+': invalid '+field);break}f[field]=n}

function changeFighterRelationship(a,b,delta,reason,mutual=true){

 }else if(action==='request-explain'){changeFighterTrust(f,0,1,'Management explained the situation');m.response='The manager explained the situation without making a commitment.'}
 else if(action==='request-decline'){changeFighterMorale(f,-3,'Career request declined');changeFighterTrust(f,-1,-4,'Career request declined');if(state.fighterRequests?.[f.id])state.fighterRequests[f.id].unresolved=(Number(state.fighterRequests[f.id].unresolved)||0)+1;m.response='Request declined.'}
 else return;

}

function promiseLedger(){if(!Array.isArray(state.promises))state.promises=[];return state.promises}
function promiseDaysLeft(p){return Math.round((new Date(p.deadline+'T12:00:00Z')-new Date(state.date+'T12:00:00Z'))/86400000)}
function promiseFighter(p){return state.fighters.find(f=>String(f.id)===String(p.fighterId))}
function promiseSatisfied(p){
 const fighter=promiseFighter(p);if(!fighter)return false;
 const bouts=state.events.flatMap(e=>(e.bouts||[]).map(b=>({event:e,bout:b})));
 return bouts.some(({event,bout})=>{
  const ids=[bout.aid,bout.bid,bout.aId,bout.bId,bout.fighterAId,bout.fighterBId].filter(x=>x!==undefined).map(String);
  if(!ids.includes(String(p.fighterId)))return false;
  const booked=eventDate(event);
  if(booked<p.created||booked>p.deadline)return false;
  if(p.kind==='fight')return true;
  if(p.kind==='title')return !!(bout.titleFight||bout.isTitleFight||bout.championship||bout.title);
  if(p.kind==='ranked'){const opponent=state.fighters.find(f=>ids.includes(String(f.id))&&String(f.id)!==String(p.fighterId));if(!opponent)return false;const ranks=rankingPositions(fighter.promotion,fighter.gender||'Male',fighter.division),own=ranks.indexOf(fighter.id),theirs=ranks.indexOf(opponent.id);return own>=0&&theirs>=0&&theirs<own}
  return false;
 });
}
function updatePromises(){
 for(const p of promiseLedger()){
  if(p.status!=='Active')continue;
  if(promiseSatisfied(p)){p.status='Fulfilled';p.resolved=state.date;const f=promiseFighter(p);if(f){changeFighterMorale(f,6,'Promise fulfilled');changeFighterTrust(f,3,9,'Promise fulfilled')}continue}
  if(promiseDaysLeft(p)<0){p.status='Broken';p.resolved=state.date;const f=promiseFighter(p);if(f){changeFighterMorale(f,-8,'Promise broken');changeFighterTrust(f,-4,-13,'Promise broken')}sendInboxMessage({key:'promise-broken-'+p.id,sender:'Management',subject:'Promise deadline missed',body:(promiseFighter(p)?.name||'A fighter')+': '+p.description+'. Management trust may be affected when the morale system is introduced.'})}
  else if(promiseDaysLeft(p)<=7&&!p.reminded){p.reminded=true;sendInboxMessage({key:'promise-due-'+p.id,sender:'Management',subject:'Fighter promise approaching deadline',body:(promiseFighter(p)?.name||'A fighter')+': '+p.description+' — due '+p.deadline+'.'})}
 }
}
function createPromise(){
 const fighterId=document.getElementById('promiseFighter')?.value;
 const kind=document.getElementById('promiseKind')?.value;
 const deadline=document.getElementById('promiseDeadline')?.value;
 const fighter=state.fighters.find(f=>String(f.id)===String(fighterId));
 if(!fighter||fighter.promotion!==state.player||!PROMISE_KINDS[kind]||!/^\d{4}-\d{2}-\d{2}$/.test(deadline)||deadline<state.date){alert('Select a roster fighter and a valid future deadline.');return}
 promiseLedger().push({id:'promise-'+Date.now()+'-'+Math.floor(Math.random()*100000),fighterId:fighter.id,kind,description:PROMISE_KINDS[kind],created:state.date,deadline,status:'Active'});
 updatePromises();save();render();
}

function rankingRecord(f,amateur=false){
 const wins=Math.max(0,Number(amateur?f.amateurWins:f.wins)||0);
 const losses=Math.max(0,Number(amateur?f.amateurLosses:f.losses)||0);
 const draws=Math.max(0,Number(amateur?f.amateurDraws:f.draws)||0);
 return {wins,losses,draws,total:wins+losses+draws};
}
function rankingScore(f,amateur=false){
 const key=amateur?'amateurElo':'resultElo';
 const r=rankingRecord(f,amateur);
 const base=Number.isFinite(f[key])?f[key]:1000+Math.min(25,r.wins)*9-Math.min(25,r.losses)*11+(r.total?((r.wins/r.total)-.5)*100:0);
 const history=(amateur?f.amateurRankingHistory:f.rankingHistory)||[];
 // Recent form is based exclusively on the last five actual fight results.
 const recent=history.slice(-5).reduce((total,h,i)=>total+(h.win?1:-1)*(i+1)*1.6,0);
 const last=amateur?f.lastAmateurFightDate:f.lastRankingFightDate;
 const idleDays=last&&state.date?Math.max(0,(Date.parse(state.date)-Date.parse(last))/86400000):0;
 // No inactivity penalty until 12 months; gradual penalty thereafter, capped at 24 months.
 const inactivity=Math.min(45,Math.max(0,idleDays-365)/30*3);
 return base+recent-inactivity;
}
function rankingPositions(promotion,gender,division){
 const amateur=promotion==='Streetbeefs';
 return state.fighters.filter(f=>(f.gender||'Male')===gender&&(promotion==='Worldwide'?f.status!=='Amateur':f.promotion===promotion&&(amateur?f.status==='Amateur':f.status!=='Amateur'))&&(division==='Pound for Pound'||(f.division===division&&f.pendingDivisionDebut!==division)))
 .sort((a,b)=>rankingScore(b,amateur)-rankingScore(a,amateur)||rankingRecord(b,amateur).wins-rankingRecord(a,amateur).wins||a.name.localeCompare(b.name))
 .slice(0,15).map(f=>f.id);
}
function rankingSnapshot(){

 for(const p of ['Worldwide',...Object.keys(PROMOS),...REGION,'Free Agent']){
  for(const gender of ['Male','Female']){
   const divisions=gender==='Male'?MALE_DIVISIONS:FEMALE_DIVISIONS;

  }
 }

function recordRankingResult(winner,loser,method,amateur=false){
